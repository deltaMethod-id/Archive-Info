<!DOCTYPE html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard | Archive Info</title>
    <link rel="icon" type="image/svg+xml" href="/public/icons/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;800&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/public/styles/dashboard.css" />
  </head>
  <body>
    <div class="shell">
      <header class="topbar">
        <div class="brand-wrap">
          <div class="brand-mark">
            <img src="/public/icons/favicon.svg" alt="Archive Info logo" />
          </div>
          <div>
            <p class="eyebrow">Archive Network</p>
            <h1>Dashboard</h1>
          </div>
        </div>
        <nav class="main-nav">
          <a href="/">Home</a>
          <a href="/list">List</a>
        </nav>
      </header>

      <main class="dashboard-grid">
        <section class="panel stat-panel">
          <p class="eyebrow red-glow">System status</p>
          <h2>Archive Monitor</h2>
          <div class="stat-grid">
            <div class="stat-box">
              <span>ZIP</span>
              <strong>94%</strong>
            </div>
            <div class="stat-box">
              <span>RAR</span>
              <strong>88%</strong>
            </div>
            <div class="stat-box">
              <span>7Z</span>
              <strong>97%</strong>
            </div>
            <div class="stat-box">
              <span>ISO</span>
              <strong>82%</strong>
            </div>
          </div>
        </section>

        <section class="panel log-panel">
          <p class="eyebrow red-glow">Operations log</p>
          <ul>
            <li>Archive check complete</li>
            <li>Compression ratio validated</li>
            <li>Backup integrity stable</li>
            <li>Security scan passed</li>
          </ul>
        </section>
      </main>
    </div>

    <script src="/public/js/dashboard.js"></script>
  </body>
</html>
